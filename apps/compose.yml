services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    shm_size: '1g'
    # Sin límite explícito, una JVM con fuga o pico de tráfico puede reclamar
    # memoria del host sin tope y el kernel termina matando a Oracle (así
    # pasó: 40h corriendo y lo mató un OOM). Con mem_limit por contenedor, si
    # algo se pasa de la raya el kernel mata SOLO a ese contenedor — Oracle
    # queda a salvo y el que se cayó vuelve solo por restart:unless-stopped.
    mem_limit: 850m
    environment:
      ORACLE_PASSWORD: EduTutorRoot2026
      # OJO: no fijar ORACLE_DATABASE=XEPDB1 — la imagen ya crea ese PDB por
      # defecto; pedirle que cree "otro" con el mismo nombre falla con
      # ORA-65012 (Pluggable database XEPDB1 already exists) en un init limpio.
      # La instancia ec2-apps tiene poca RAM real; sin esto Oracle intenta
      # autodimensionar la SGA/PGA y falla con ORA-27104 al no conseguir la
      # memoria compartida que calculó. Con esto fija un tamaño que sí cabe.
      INIT_SGA_SIZE: '400'
      INIT_PGA_SIZE: '200'
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  catalog:
    build: ../../ms-edututor-catalog
    container_name: catalog
    mem_limit: 160m
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      JAVA_TOOL_OPTIONS: -Xmx90m -XX:MaxMetaspaceSize=56m
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  sessions:
    build: ../../ms-edututor-sessions
    container_name: sessions
    mem_limit: 180m
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      JAVA_TOOL_OPTIONS: -Xmx100m -XX:MaxMetaspaceSize=64m
      # Elastic IP de ec2-kafka (compañero) — fija, no cambia entre reinicios
      # del lab. Si no responde, es que su instancia/contenedores no están
      # arriba en ese momento, no que la IP haya cambiado.
      KAFKA_BOOTSTRAP_SERVERS: 184.192.63.192:9092
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  notify:
    build: ../../ms-edututor-notify
    container_name: notify
    mem_limit: 150m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx80m -XX:MaxMetaspaceSize=56m
      # Elastic IP de ec2-mq (compañero) — fija, no cambia entre reinicios
      # del lab. Si no responde, es que su instancia/contenedores no están
      # arriba en ese momento, no que la IP haya cambiado.
      RABBITMQ_HOST: 44.208.153.147
    restart: unless-stopped

  audit:
    build: ../../ms-edututor-audit
    container_name: audit
    mem_limit: 170m
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      KAFKA_BOOTSTRAP_SERVERS: 184.192.63.192:9092
      JAVA_TOOL_OPTIONS: -Xmx90m -XX:MaxMetaspaceSize=64m
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  report:
    build: ../../ms-edututor-report
    container_name: report
    mem_limit: 180m
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      KAFKA_BOOTSTRAP_SERVERS: 184.192.63.192:9092
      JAVA_TOOL_OPTIONS: -Xmx100m -XX:MaxMetaspaceSize=64m
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build: ../../ms-edututor-bff
    container_name: bff
    mem_limit: 200m
    ports:
      - "8080:8080"
    environment:
      CATALOG_URL: http://catalog:8082/api
      SESSIONS_URL: http://sessions:8083/api
      AUDIT_URL: http://audit:8084/api
      REPORT_URL: http://report:8085/api
      JAVA_TOOL_OPTIONS: -Xmx120m -XX:MaxMetaspaceSize=64m
    depends_on:
      - catalog
      - sessions
      - audit
      - report
    restart: unless-stopped

volumes:
  oracle_data:
