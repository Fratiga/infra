spring:
  application:
    name: kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8087}

# Tópicos de EduTutor. Es la única fuente: el aprovisionamiento al arrancar
# (TopicProvisioner) y la protección contra borrados salen de esta lista.
# Los servicios productores y consumidores usan estos mismos nombres en su
# propio application.yml.
#
# Cada flujo tiene los parámetros que le corresponden:
#  - sessions.events: log de hechos, se descarta por tiempo (7 días). Lo leen
#    audit y report, cada uno con su grupo.
#  - sessions.alerts: una alerta por (estudiante, regla); se compacta para
#    conservar solo la última de cada key, y además se acota a 30 días.
#  - *.DLT: mensajes que no se pudieron procesar; se guardan más tiempo (14
#    días) para poder revisarlos. Tienen las mismas particiones que su tópico
#    de origen, porque el reenvío mantiene el número de partición.
#
# replication-factor y min-insync-replicas dependen del clúster: 1 en un solo
# broker (EC2 / desarrollo), 3 y 2 en el clúster de 3 brokers (compose.cluster.yml).
edututor:
  kafka:
    provision-on-startup: ${KAFKA_PROVISION_ON_STARTUP:true}
    topics:
      - name: sessions.events
        partitions: 3
        replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
        configs:
          "[retention.ms]": "604800000"
          "[retention.bytes]": "1073741824"
          "[segment.bytes]": "104857600"
          "[cleanup.policy]": delete
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:1}
          "[compression.type]": producer

      - name: sessions.alerts
        partitions: 3
        replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
        configs:
          "[retention.ms]": "2592000000"
          "[cleanup.policy]": compact,delete
          "[min.cleanable.dirty.ratio]": "0.1"
          "[segment.ms]": "86400000"
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:1}

      - name: sessions.events.DLT
        partitions: 3
        replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
        configs:
          "[retention.ms]": "1209600000"
          "[cleanup.policy]": delete
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:1}

      - name: sessions.alerts.DLT
        partitions: 3
        replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
        configs:
          "[retention.ms]": "1209600000"
          "[cleanup.policy]": delete
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:1}

      # Solo para las pruebas de carga (LoadTestService). Retención agresiva a
      # propósito, para ver en poco tiempo cómo Kafka borra lo antiguo: 5 minutos o
      # 50 MB por partición, lo que ocurra primero. Kafka solo borra segmentos
      # cerrados, así que los segmentos son chicos (1 minuto / 10 MB).
      - name: sessions.loadtest
        partitions: 3
        replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
        configs:
          "[retention.ms]": "300000"
          "[retention.bytes]": "52428800"
          "[segment.ms]": "60000"
          "[segment.bytes]": "10485760"
          "[cleanup.policy]": delete
          "[min.insync.replicas]": ${KAFKA_MIN_ISR:1}

# Token de la API de administración (cabecera X-Admin-Token). Vacío = sin
# exigirlo, solo para desarrollo local; en cualquier servidor debe definirse.
edututor.admin.token: ${KAFKA_ADMIN_TOKEN:}

# Pruebas de carga y tuning (POST /api/loadtest). Apagado por defecto: en un
# servidor real no debe poder generarse tráfico masivo.
edututor.loadtest:
  enabled: ${KAFKA_LOADTEST_ENABLED:false}
  topic: sessions.loadtest
  group: loadtest-analytics-v1
  # milisegundos que tarda el consumidor en "procesar" cada mensaje
  consumer-delay-ms: ${KAFKA_LOADTEST_CONSUMER_DELAY_MS:10}
  consumer-concurrency: ${KAFKA_LOADTEST_CONSUMER_CONCURRENCY:1}
