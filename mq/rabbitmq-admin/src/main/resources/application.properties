spring.application.name=rabbitmq-admin
server.port=${SERVER_PORT:8086}

# Lista de nodos del clúster (host:puerto separados por coma). Si no se define,
# usa RABBITMQ_HOST/RABBITMQ_PORT como antes.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Nombres de exchanges, colas y rutas de la mensajería de EduTutor. Es la única
# fuente: la topología (RabbitTopologyConfig) y la protección de recursos
# gestionados salen de aquí. ms-edututor-sessions (publica) y ms-edututor-notify
# (consume) declaran los mismos nombres en su propio application.properties.
edututor.rabbit.exchange.direct=cmd.direct
edututor.rabbit.exchange.topic=cmd.topic
edututor.rabbit.exchange.dead-letter=cmd.dead.dlx
edututor.rabbit.dlq-suffix=.dlq

edututor.rabbit.email.queue=q.cmd.email
edututor.rabbit.email.direct-key=email.send
edututor.rabbit.email.topic-key=email.*
edututor.rabbit.email.dlq-key=email.dlq

edututor.rabbit.session.queue=q.cmd.session
edututor.rabbit.session.direct-key=session.ticket
edututor.rabbit.session.topic-key=session.#
edututor.rabbit.session.dlq-key=session.dlq

edututor.rabbit.certificate.queue=q.cmd.certificate
edututor.rabbit.certificate.direct-key=certificate.gen
edututor.rabbit.certificate.topic-key=certificate.*
edututor.rabbit.certificate.dlq-key=certificate.dlq
