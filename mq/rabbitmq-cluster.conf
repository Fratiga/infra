# Formación automática del clúster: ambos nodos se listan entre sí y el que
# arranca segundo se une al primero.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# En segundos (el PDF decía 10000, que serían casi 3 horas).
cluster_formation.node_cleanup.interval = 30
cluster_formation.node_cleanup.only_log_warning = true

# Reemplaza a queue_master_location (que no existe en 3.12): reparte el nodo
# líder de las colas nuevas entre los nodos del clúster.
queue_leader_locator = balanced
